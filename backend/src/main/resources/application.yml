spring:
  application:
    name: aiprojecteval
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:file:.env[.properties]

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:replace-this-with-a-long-development-secret-key-at-least-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

document:
  google-drive:
    validation-enabled: ${DOCUMENT_GOOGLE_DRIVE_VALIDATION_ENABLED:false}
    max-file-size-mb: ${DOCUMENT_GOOGLE_DRIVE_MAX_FILE_SIZE_MB:10}
    service-account-json-path: ${DOCUMENT_GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON_PATH:${GOOGLE_APPLICATION_CREDENTIALS:}}
    allowed-mime-types:
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.google-apps.document
