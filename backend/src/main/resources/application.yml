spring:
  application:
    name: aiprojecteval
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:file:.env[.properties]

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:replace-this-with-a-long-development-secret-key-at-least-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

document-evaluation:
  storage:
    provider: ${DOCUMENT_EVALUATION_STORAGE_PROVIDER:local}
    local-root: ${DOCUMENT_EVALUATION_STORAGE_LOCAL_ROOT:uploads/document-evaluation}
    max-file-size: ${DOCUMENT_EVALUATION_STORAGE_MAX_FILE_SIZE:10485760}
